name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: >
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic
          -o graph_tests
          tests.cpp graph.cpp graph_algorithms.cpp erdos_renyi.cpp barabasi_albert.cpp
      - run: ./graph_tests
      - name: Build application
        run: >
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic
          -o Project3.out
          main.cpp graph.cpp graph_algorithms.cpp erdos_renyi.cpp barabasi_albert.cpp
      - run: ./Project3.out --output ci-results
      - run: test -s ci-results/er_info.csv && test -s ci-results/ba_info.csv
